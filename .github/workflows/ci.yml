name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Apple silicon runner, the only platform Apple container supports.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: make build

      - name: Smoke test
        # Parsing and conversion only: the runner has no Apple container runtime.
        run: |
          ./bin/container-compose version --short
          ./bin/container-compose -f testdata/compose.yaml config --quiet
          ./bin/container-compose -f testdata/compose.yaml config --services
          CONTAINER_BIN=$PWD/testdata/fake-container ./bin/container-compose -f testdata/compose.yaml --dry-run up -d 2>&1 | tee /dev/stderr | grep -q "DRY-RUN: container create"

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

      - name: Snapshot build
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          HOMEBREW_TAP_DEPLOY_KEY: unused
